name: kotostok
services:
  db:
    image: postgres
    env_file: .env
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d myapp']
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql
    ports:
      - '5432:5432'

volumes:
  postgres_data:
